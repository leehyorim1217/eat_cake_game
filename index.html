<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>똥피하기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css">
<style>
:root{--bg:#0d0d1a;--navy:#1b1b2f;--cream:#f4f1de;--sun:#ffd23f;--red:#e63946}
*{box-sizing:border-box;border-radius:0}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);font-family:'Galmuri11','DotGothic16','Malgun Gothic',monospace;color:var(--cream);display:flex;align-items:center;justify-content:center;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
#wrap{position:relative;width:min(100vw,calc(100dvh*2/3));aspect-ratio:2/3;background:#5c94fc}
#wrap::after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 4px var(--cream),inset 0 0 0 8px #000}
canvas{display:block;width:100%;height:100%;touch-action:none}
#ui{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(13,13,26,.6)}
.card{background:var(--navy);border:4px solid var(--cream);box-shadow:0 0 0 4px #000,8px 8px 0 4px rgba(0,0,0,.5);padding:24px 20px;text-align:center;width:100%;max-width:320px;max-height:100%;overflow:auto;scrollbar-width:thin;scrollbar-color:#f4f1de #1b1b2f}
h1{margin:0 0 12px;font-size:clamp(30px,9vw,44px);font-weight:400;line-height:1.15;color:var(--sun);text-shadow:3px 3px 0 var(--red)}
p{margin:0 0 20px;font-size:clamp(13px,3.6vw,15px);line-height:1.7}
b{color:var(--sun);font-weight:400}
button{font:inherit;font-size:20px;color:var(--navy);background:var(--sun);border:4px solid #000;padding:10px 24px;box-shadow:inset 4px 4px 0 #fff3b0,inset -4px -4px 0 #c99700;cursor:pointer}
button:active{box-shadow:inset 4px 4px 0 #c99700,inset -4px -4px 0 #fff3b0;transform:translate(2px,2px)}
button:focus-visible{outline:3px dashed var(--red);outline-offset:4px}
#m{position:absolute;top:56px;right:14px;font-size:16px;padding:2px 6px;background:var(--navy);border:3px solid var(--cream);box-shadow:0 0 0 3px #000}
.up{margin-top:16px}
#set h1{font-size:28px;margin-bottom:8px}
.hint{font-size:12px;margin-bottom:6px}
.sec{margin-top:14px;text-align:left}
.sec h2{display:flex;justify-content:space-between;align-items:center;margin:0 0 6px;font-size:14px;font-weight:400;color:var(--sun)}
.grid{display:grid;grid-template-columns:repeat(5,48px);gap:8px;padding:8px;border:2px dashed #55557f;min-height:68px}
.grid.drag{border-color:var(--sun);background:rgba(255,210,63,.12)}
.th{position:relative;width:48px;height:48px;border:2px solid var(--cream);background:repeating-conic-gradient(#2a2a44 0 25%,#34345a 0 50%) 0 0/12px 12px}
.th img{width:100%;height:100%;object-fit:contain;display:block}
.x{position:absolute;top:-9px;right:-9px;width:20px;height:20px;padding:0;font-size:11px;line-height:1;background:var(--red);color:#fff;border:2px solid #000;box-shadow:none}
.add{width:48px;height:48px;padding:0;font-size:24px;background:#3a3a5c;color:var(--cream);border:2px dashed var(--cream);box-shadow:none}
.none{grid-column:2/-1;align-self:center;font-size:12px;opacity:.75}
#back{margin-top:18px}
.alt{font-size:14px;padding:4px 10px;background:#3a3a5c;color:var(--cream);border:3px solid var(--cream);box-shadow:none}
.alt:active{background:#55557f;transform:none;box-shadow:none}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="g" aria-label="똥피하기 게임 화면"></canvas>
  <div id="ui">
    <div class="card" id="main">
      <h1 id="t">똥피하기 💩</h1>
      <p id="d">먹이는 먹고 똥은 피해야 합니다.<br>똥에 닿으면 목숨이 줄고, 3개를 모두 잃으면 끝납니다.<br>← → / A D 키, 마우스, 터치로 움직입니다.<br>먹이를 연속으로 먹으면 콤보 점수가 올라갑니다.</p>
      <button id="b" autofocus>▶ 시작하기</button>
      <div class="up"><button class="alt" id="gs">🖼 이미지 설정</button></div>
    </div>
    <div class="card" id="set" hidden>
      <h1>이미지 설정</h1>
      <p class="hint">이미지를 끌어다 놓거나 + 칸을 눌러 추가합니다.<br>여러 장을 한 번에 선택할 수 있으며, 이 브라우저에만 저장됩니다.</p>
      <div id="secs"></div>
      <button id="back">확인</button>
    </div>
    <input id="f" type="file" accept="image/*" hidden>
  </div>
  <button id="m" aria-label="소리 켜기/끄기">🔊</button>
</div>
<script>
const cv = document.getElementById('g'), ctx = cv.getContext('2d');
const W = 400, H = 600;
let S = 1;                                    // 화면 배율 (논리 좌표 → 실제 픽셀)
const sn = v => Math.round(v * S) / S;        // 실제 픽셀에 맞춰 좌표 정렬
function resize() {
  const r = cv.getBoundingClientRect(), d = window.devicePixelRatio || 1;
  cv.width = Math.max(1, Math.round(r.width * d)); cv.height = Math.max(1, Math.round(r.height * d));
  S = cv.width / W;
}
resize(); new ResizeObserver(resize).observe(cv);
const ui = document.getElementById('ui'), tEl = document.getElementById('t'),
      dEl = document.getElementById('d'), bEl = document.getElementById('b');

// ===== 설정 (여기만 바꿔도 게임 느낌이 달라져요) =====
// 이미지: 경로를 넣으면 그 이미지, 파일이 없거나 비워두면 이모지로 표시돼요. (투명 배경 PNG 권장)
const ASSETS = {
  char:  'img/char.png',                      // 캐릭터
  poop:  'img/poop.png',                      // 똥 (닿으면 게임 오버)
  foods: ['img/food1.png', 'img/food2.png'],  // 먹이 (여러 장이면 랜덤)
};
// 효과음: 경로를 넣으면 그 파일, 비워두면 내장 효과음이 나와요. (mp3/ogg/wav)
const SOUNDS = { start: '', eat: '', hit: '', over: '' };   // 예: eat: 'sfx/eat.mp3'
// 이미지가 없을 때 대신 쓰는 이모지
const CHAR = '🐥', POOP = '💩', FOODS = ['🍎', '🍙', '🍪', '🍓'];
const SIZE = { char: 48, item: 40 };        // 화면에 그려지는 크기(px)
const FOOD_POINT = 10;                      // 먹이 1개 점수
const MOVE_SPEED = 440;                    // 키보드 이동 속도(px/s)
const FOLLOW = 30;                         // 마우스·터치 추적 속도 (클수록 빠르게 따라옴)
const BASE_FALL  = 150;                     // 기본 낙하 속도(px/s)
const RAMP = 220;                          // 점수가 이만큼 오를 때마다 속도 +1배 (클수록 완만하게 빨라짐)
const LIVES = 3;                           // 목숨 개수
// =====================================================

// ----- 이미지 로드 -----
function loadImg(src) {
  const im = new Image(); im.ok = false;
  if (src) { im.onload = () => { im.ok = true; }; im.src = src; }
  return im;
}
const IMG = { char: loadImg(ASSETS.char), poop: loadImg(ASSETS.poop), foods: ASSETS.foods.map(loadImg) };
function sprite(img, emoji, x, y, size, rot, sx, sy) {
  ctx.save(); ctx.translate(sn(x), sn(y)); ctx.rotate(rot || 0); ctx.scale(sx || 1, sy || 1);
  if (img && img.ok) {
    const k = size / Math.max(img.naturalWidth, img.naturalHeight);
    const w = sn(img.naturalWidth * k), h = sn(img.naturalHeight * k);
    ctx.drawImage(img, sn(-w / 2), sn(-h / 2), w, h);
  } else { ctx.fillStyle = '#000'; ctx.font = (size * 0.9) + 'px serif'; ctx.fillText(emoji, 0, 0); }
  ctx.restore();
}

// ----- 효과음 (파일이 없으면 WebAudio로 직접 합성) -----
let muted = false;
try { muted = localStorage.getItem('dodgeMute') === '1'; } catch (e) {}
let ac = null;
function audio() {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (ac && ac.state === 'suspended') ac.resume();
  return ac;
}
function tone(f1, f2, dur, type, vol, delay) {
  const a = audio(); if (!a) return;
  const t = a.currentTime + (delay || 0), o = a.createOscillator(), g = a.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(f1, t);
  o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(vol || 0.12, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t + dur);
}
const SYNTH = {
  start: () => { tone(330, 660, 0.1); tone(660, 990, 0.12, 'square', 0.12, 0.1); },
  eat:   () => { tone(660, 880, 0.07); tone(990, 1320, 0.1, 'square', 0.12, 0.07); },
  hit:   () => { tone(260, 80, 0.25, 'sawtooth', 0.16); },
  over:  () => { tone(300, 90, 0.45, 'sawtooth', 0.18); tone(180, 50, 0.5, 'sawtooth', 0.18, 0.25); },
};
function sfx(name) {
  if (muted) return;
  if (SOUNDS[name]) {
    const a = new Audio(SOUNDS[name]);
    a.onerror = () => SYNTH[name]();
    a.play().catch(() => {});
  } else SYNTH[name]();
}

let best = 0;
try { best = +localStorage.getItem('dodgeBest') || 0; } catch (e) {}

const P = { x: W / 2, y: H - 52 };
let items = [], pops = [], score = 0, spawn = 0, state = 'ready', last = 0, tx = null, combo = 0, shake = 0, flash = 0, time = 0, parts = [], lives = 3, inv = 0;
const keys = {};

function start() {
  items = []; pops = []; parts = []; score = 0; combo = 0; shake = 0; flash = 0; lives = LIVES; inv = 0; spawn = 0; tx = null; P.x = W / 2;
  state = 'play'; ui.hidden = true; last = performance.now(); sfx('start');
}

function gameOver() {
  state = 'over'; sfx('over'); inv = 0; shake = 0.5; flash = 0.6; burst(P.x, P.y, '#8b5a2b', 28);
  const isBest = score > best;
  if (isBest) { best = score; try { localStorage.setItem('dodgeBest', best); } catch (e) {} }
  tEl.textContent = '게임 오버 💩';
  dEl.innerHTML = '점수 <b>' + score + '</b> · 최고 <b>' + best + '</b>' + (isBest ? '<br>신기록입니다!' : '');
  bEl.textContent = '▶ 다시 하기';
  showMain(); ui.hidden = false; bEl.focus();
}

function update(dt) {
  const px = P.x, kx = (keys.ArrowRight || keys.KeyD ? 1 : 0) - (keys.ArrowLeft || keys.KeyA ? 1 : 0);
  if (kx) { tx = null; P.x += kx * MOVE_SPEED * dt; }
  if (tx !== null) P.x += (tx - P.x) * (1 - Math.exp(-dt * FOLLOW));
  P.x = Math.max(22, Math.min(W - 22, P.x));
  P.vx = (P.x - px) / (dt || 0.016);

  const level = Math.min(3, 1 + score / RAMP);   // 점수가 오를수록 빨라짐 (최대 3배)
  spawn -= dt; inv = Math.max(0, inv - dt);
  if (spawn <= 0) {
    spawn = Math.max(0.25, 0.7 / level);
    const poop = Math.random() < Math.min(0.7, 0.45 + score / 1000);
    const k = Math.random() * (ASSETS.foods.length || FOODS.length) | 0;
    items.push({ x: 20 + Math.random() * (W - 40), y: -30, poop, r: Math.random() * 6.28, w: (Math.random() - .5) * 5,
      v: (BASE_FALL + Math.random() * 80) * level,
      e: poop ? POOP : FOODS[k % FOODS.length], img: pickImg(poop, k) });
  }

  for (let i = items.length - 1; i >= 0; i--) {
    const it = items[i];
    it.y += it.v * dt; it.r += it.w * dt;
    if (Math.hypot(it.x - P.x, it.y - P.y) < 32 && !(it.poop && inv > 0)) {   // 피격 직후 1.5초는 무적
      if (it.poop) {
        items.splice(i, 1); combo = 0;
        if (--lives <= 0) { gameOver(); return; }
        inv = 1.5; shake = 0.3; flash = 0.35; sfx('hit'); burst(it.x, it.y, '#8b5a2b', 14);
        continue;
      }
      combo++; const pt = FOOD_POINT * mult();
      score += pt; sfx('eat'); P.sq = 1;
      pops.push({ x: it.x, y: it.y, t: 0, v: pt }); burst(it.x, it.y, '#ffd166', 10);
      items.splice(i, 1);
    } else if (it.y > H + 30) { if (!it.poop) combo = 0; items.splice(i, 1); }
  }
  for (let i = pops.length - 1; i >= 0; i--) { pops[i].t += dt; if (pops[i].t > 0.6) pops.splice(i, 1); }
}

const mult = () => Math.min(5, 1 + ((combo - 1) / 3 | 0));   // 콤보 배율 (최대 x5)
function burst(x, y, c, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.28, v = 80 + Math.random() * 180;
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 120, t: 0, c });
  }
}
function stepFx(dt) {
  shake = Math.max(0, shake - dt); flash = Math.max(0, flash - dt * 1.5);
  P.sq = Math.max(0, (P.sq || 0) - dt * 5);
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.t += dt; p.vy += 600 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.t > 0.6) parts.splice(i, 1);
  }
}
const F = n => n + "px 'Galmuri11','DotGothic16','Malgun Gothic',monospace";
const SKY = ['#5c94fc', '#6ba0ff', '#7bacff', '#8cb8ff', '#9dc4ff', '#aed0ff'];
const clouds = [[30, 80, 2], [230, 140, 1.5], [330, 40, 1]];
function cloud(x, y, k) {
  const u = 4 * k;
  ctx.fillStyle = '#fff';
  for (const [dx, dy, w] of [[2, 0, 4], [1, 1, 6], [0, 2, 8]]) ctx.fillRect(x + dx * u, y + dy * u, w * u, u);
  ctx.fillStyle = '#c4dcff'; ctx.fillRect(x, y + 3 * u, 8 * u, u / 2);
}
function box(x, y, w, h) {
  ctx.fillStyle = '#1b1b2f'; ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = '#f4f1de'; ctx.lineWidth = 3; ctx.strokeRect(x + 1.5, y + 1.5, w - 3, h - 3);
}
const HEART = ['.XX.XX.', 'XXXXXXX', 'XXXXXXX', '.XXXXX.', '..XXX..', '...X...'];
function heart(x, y, u, c) {
  HEART.forEach((row, j) => { for (let i = 0; i < 7; i++) if (row[i] === 'X') ctx.fillRect(x + i * u, y + j * u, u, u); });
}
function label(t, x, y, c) { x = sn(x); y = sn(y); ctx.fillStyle = '#000'; ctx.fillText(t, x + 2, y + 2); ctx.fillStyle = c; ctx.fillText(t, x, y); }
function draw() {
  ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - .5) * shake * 24, (Math.random() - .5) * shake * 24);
  SKY.forEach((c, i) => { ctx.fillStyle = c; ctx.fillRect(-20, i * H / 6 - 1, W + 40, H / 6 + 2); });
  for (const c of clouds) cloud(Math.round((c[0] + time * 14 * c[2]) % (W + 160) - 80), c[1], c[2]);

  ctx.fillStyle = '#c84c0c'; ctx.fillRect(-20, H - 40, W + 40, 60);                // 벽돌 바닥
  ctx.fillStyle = '#7c2c00';
  ctx.fillRect(-20, H - 17, W + 40, 2); ctx.fillRect(-20, H - 1, W + 40, 2);
  for (let x = 0; x < W + 32; x += 32) { ctx.fillRect(x, H - 32, 2, 15); ctx.fillRect(x + 16, H - 15, 2, 14); }
  ctx.fillStyle = '#00a800'; ctx.fillRect(-20, H - 40, W + 40, 8);                  // 잔디 띠
  ctx.fillStyle = '#005800'; ctx.fillRect(-20, H - 32, W + 40, 2);

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const it of items) {                    // 그림자 → 본체
    const a = Math.min(1, it.y / H), w = Math.round(8 + 12 * a);
    ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(Math.round(it.x) - w, H - 38, w * 2, 3);
    sprite(it.img, it.e, it.x, it.y, SIZE.item, it.poop ? it.r : Math.sin(time * 4 + it.r) * .25);
  }
  ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(Math.round(P.x) - 22, H - 38, 44, 3);
  const mv = Math.min(1, Math.abs(P.vx || 0) / 200);
  if (inv <= 0 || (time * 12 | 0) % 2) sprite(CUSTOM.char.find(i => i.ok) || IMG.char, CHAR, P.x, P.y + Math.sin(time * 12) * 2 * mv, SIZE.char);

  for (const p of parts) { ctx.globalAlpha = 1 - p.t / .6; ctx.fillStyle = p.c; ctx.fillRect(Math.round(p.x), Math.round(p.y), 6, 6); }
  ctx.globalAlpha = 1; ctx.font = F(22);
  for (const p of pops) { ctx.globalAlpha = 1 - p.t / .6; label('+' + p.v, p.x, p.y - 22 - p.t * 50, '#fff'); }
  ctx.globalAlpha = 1;
  ctx.restore();

  if (flash > 0) { ctx.fillStyle = 'rgba(230,57,70,' + flash * .55 + ')'; ctx.fillRect(0, 0, W, H); }
  box(10, 10, 170, 40); box(W - 180, 10, 170, 40);                                  // HUD
  ctx.font = "18px 'Galmuri9','Galmuri11','DotGothic16','Malgun Gothic',monospace";   // Galmuri9의 2배 크기 (또렷함 유지)
  ctx.textAlign = 'left';  label('점수 ' + score, 22, 31, '#ffd23f');
  ctx.textAlign = 'right'; label('최고 ' + best, W - 22, 31, '#f4f1de');
  for (let i = 0; i < LIVES; i++) {                                                // 목숨
    const hx = 14 + i * 27, hy = 58;
    ctx.fillStyle = '#000'; heart(hx + 2, hy + 2, 3);
    ctx.fillStyle = i < lives ? '#e63946' : '#3a3a5c'; heart(hx, hy, 3);
  }
  if (state === 'play' && combo >= 2) {
    ctx.textAlign = 'center'; ctx.font = F(mult() >= 3 ? 33 : 22);
    label('콤보 ' + combo + '  x' + mult(), W / 2, 78, '#ff9f1c');
  }
}

function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  time += dt; if (state === 'play') update(dt); stepFx(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(t => { last = t; loop(t); });

// ===== 입력 =====
addEventListener('keydown', e => {
  const onBtn = !!(e.target.closest && e.target.closest('button'));
  if (!onBtn && ['ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  keys[e.code] = true;
  if (e.code === 'KeyM') toggleMute();
  if (state !== 'play' && !onBtn && setEl.hidden && (e.code === 'Space' || e.code === 'Enter')) start();
});
addEventListener('keyup', e => { keys[e.code] = false; });
function pointerX(e) { const r = cv.getBoundingClientRect(); return (e.clientX - r.left) / r.width * W; }
cv.addEventListener('pointerdown', e => { if (state === 'play') tx = pointerX(e); });
cv.addEventListener('pointermove', e => { if (state === 'play') tx = pointerX(e); });
bEl.addEventListener('click', start);
const mEl = document.getElementById('m');
function showMute() { mEl.textContent = muted ? '🔇' : '🔊'; }
function toggleMute() { muted = !muted; try { localStorage.setItem('dodgeMute', muted ? '1' : '0'); } catch (e) {} showMute(); }
mEl.addEventListener('click', () => { toggleMute(); mEl.blur(); });
showMute();

// ----- 이미지 설정 (업로드 · 개별 삭제 · 끌어놓기) -----
const MAX_PX = 256;                          // 업로드 이미지를 이 크기 이하로 자동 축소 (비율 유지)
const MAX_N  = 8;                            // 똥/먹이 종류별 최대 장수 (넘으면 오래된 것부터 삭제)
const KINDS = [['char', '캐릭터', 1], ['poop', '똥', MAX_N], ['food', '먹이', MAX_N]];
const DATA = { char: [], poop: [], food: [] }, CUSTOM = { char: [], poop: [], food: [] };
const fEl = document.getElementById('f'), secs = document.getElementById('secs'),
      mainEl = document.getElementById('main'), setEl = document.getElementById('set');
let target = null;
const el = (t, c, txt) => { const e = document.createElement(t); if (c) e.className = c; if (txt) e.textContent = txt; return e; };

// 업로드한 이미지가 있으면 그중 랜덤, 없으면 ASSETS/이모지 기본값
function pickImg(poop, k) {
  const l = (poop ? CUSTOM.poop : CUSTOM.food).filter(i => i.ok);
  return l.length ? l[Math.random() * l.length | 0] : (poop ? IMG.poop : IMG.foods[k]);
}
function showMain() { mainEl.hidden = false; setEl.hidden = true; mEl.hidden = false; }
function showSet() { mainEl.hidden = true; setEl.hidden = false; mEl.hidden = true; render(); setEl.scrollTop = 0; }

function setKind(k, list) {
  DATA[k] = list; CUSTOM[k] = list.map(loadImg);
  try { localStorage.setItem('dodgeImg_' + k, JSON.stringify(list)); }
  catch (e) { alert('저장 공간이 부족하여 이 이미지는 새로고침 후 유지되지 않을 수 있습니다.'); }
  render();
}
function shrink(f) {
  return new Promise(res => {
    const url = URL.createObjectURL(f), im = new Image();
    im.onload = () => {
      URL.revokeObjectURL(url);
      if (!im.naturalWidth) return res(null);
      const k = Math.min(1, MAX_PX / Math.max(im.naturalWidth, im.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(im.naturalWidth * k));
      c.height = Math.max(1, Math.round(im.naturalHeight * k));
      const x = c.getContext('2d'); x.imageSmoothingQuality = 'high';
      x.drawImage(im, 0, 0, c.width, c.height);
      res(c.toDataURL('image/webp', 0.92));  // 미지원 브라우저는 PNG로 저장됨 (투명 유지)
    };
    im.onerror = () => { URL.revokeObjectURL(url); res(null); };
    im.src = url;
  });
}
async function addFiles(k, fl) {
  const max = KINDS.find(x => x[0] === k)[2];
  const files = [...fl].filter(f => f.type.startsWith('image/'));
  if (!files.length) return;
  const got = (await Promise.all(files.map(shrink))).filter(Boolean);
  if (!got.length) return alert('이미지를 불러오지 못했습니다.');
  setKind(k, max === 1 ? got.slice(0, 1) : DATA[k].concat(got).slice(-max));
}
function render() {
  secs.innerHTML = '';
  for (const [k, name, max] of KINDS) {
    const list = DATA[k], sec = el('div', 'sec'), h = el('h2');
    h.append(el('span', '', name + ' ' + list.length + '/' + max));
    if (list.length) { const c = el('button', 'alt', '전체 삭제'); c.onclick = () => setKind(k, []); h.append(c); }
    const grid = el('div', 'grid');
    list.forEach((src, i) => {
      const t = el('div', 'th'), im = new Image(), x = el('button', 'x', '✕');
      im.src = src; im.alt = name + ' ' + (i + 1);
      x.title = '삭제'; x.setAttribute('aria-label', name + ' ' + (i + 1) + ' 삭제');
      x.onclick = () => setKind(k, list.filter((_, j) => j !== i));
      t.append(im, x); grid.append(t);
    });
    if (list.length < max) {
      const a = el('button', 'add', '+'); a.title = name + ' 이미지 추가';
      a.onclick = () => { target = k; fEl.multiple = max > 1; fEl.click(); };
      grid.append(a);
    }
    if (!list.length) grid.append(el('span', 'none', '기본 이미지를 사용합니다.'));
    grid.ondragover = e => { e.preventDefault(); grid.classList.add('drag'); };
    grid.ondragleave = () => grid.classList.remove('drag');
    grid.ondrop = e => { e.preventDefault(); grid.classList.remove('drag'); addFiles(k, e.dataTransfer.files); };
    sec.append(h, grid); secs.append(sec);
  }
}
fEl.addEventListener('change', () => { const f = [...fEl.files]; fEl.value = ''; if (target) addFiles(target, f); });
document.getElementById('gs').onclick = showSet;
document.getElementById('back').onclick = () => { showMain(); bEl.focus(); };
addEventListener('keydown', e => { if (e.code === 'Escape' && !setEl.hidden) { showMain(); bEl.focus(); } });
addEventListener('dragover', e => e.preventDefault());   // 설정 칸 밖에 놓아도 페이지가 이동하지 않도록
addEventListener('drop', e => e.preventDefault());
for (const [k] of KINDS) {                   // 저장된 이미지 복원
  try {
    const raw = localStorage.getItem('dodgeImg_' + k) || (k === 'char' && localStorage.getItem('dodgeChar'));
    if (raw) setKind(k, raw[0] === '[' ? JSON.parse(raw) : [raw]);
  } catch (e) {}
}
render();
</script>
</body>
</html>
